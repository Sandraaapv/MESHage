<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="MESHage - Offline Short Range Wireless Mesh Messenger">
  <meta name="theme-color" content="#0E0F12">
  <link rel="manifest" href="manifest.json">
  <title>MESHage - Offline Mesh</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <div class="connection-dot" id="connectionDot" title="Network status: Connected"></div>
        <h1 class="node-title" id="nodeNameHeader">MESHage</h1>
      </div>

      <div class="header-actions">
        <!-- Live Peer count pill button (minimum 44x44px, opens sheet) -->
        <button class="peer-count-pill" id="openNeighborsBtn" aria-label="View mesh neighbors">
          <span class="peer-dot"></span>
          <span id="neighborCountText">0 peers</span>
        </button>
      </div>
    </header>

    <!-- Compact Mint Node Card -->
    <section class="mesh-banner-card" id="meshBannerCard">
      <div class="banner-top">
        <div class="banner-badge">
          <span class="live-dot"></span>
          <span id="bannerStatusText">Mesh online</span>
        </div>
        <div class="banner-route-tag" id="bannerRouteTag">Ready</div>
      </div>
      <h2 class="banner-title" id="bannerTitle">Node</h2>
      <p class="banner-subtitle" id="bannerSubtitle">Wi-Fi UDP port 5001 &bull; AES-256 encrypted</p>
      
      <!-- Peer circles inside card: "You" (green ring), peers (white circle + hop count), offline (dashed) -->
      <div class="banner-peers-container">
        <div class="banner-peers-row" id="bannerPeersRow">
          <!-- Rendered live by JS -->
        </div>
        <div class="banner-hint" id="bannerHint" style="display: none;">Looking for peers on UDP 5001</div>
      </div>
    </section>

    <!-- Chat Messages Container -->
    <main class="chat-container" id="chatContainer" role="log" aria-live="polite">
      <!-- One small muted line when no messages -->
      <div class="empty-line" id="emptyHint">No messages yet &bull; Direct wireless mesh</div>
    </main>

    <!-- Fixed Composer Bottom -->
    <footer class="composer-container">
      <!-- Recipient chips row ("To:" then Everyone, then known peers) -->
      <div class="dest-chips-container" id="destChipsContainer">
        <span class="dest-label">To:</span>
        <div class="dest-chips-scroll" id="destChipsScroll">
          <button type="button" class="dest-chip active" data-dst="ALL">Everyone</button>
        </div>
      </div>

      <div class="composer-row">
        <!-- Emergency SOS Button with Progress Ring and "Hold" caption -->
        <div class="emergency-col">
          <div class="emergency-btn-wrapper" id="sosWrapper" title="Press and hold 1.5s for emergency SOS">
            <svg class="sos-ring" viewBox="0 0 48 48">
              <circle class="sos-ring-circle" cx="24" cy="24" r="22"></circle>
            </svg>
            <button class="emergency-btn" id="sosBtn" type="button" aria-label="Emergency SOS: press and hold for 1.5 seconds">SOS</button>
          </div>
          <span class="sos-caption">Hold</span>
        </div>

        <!-- Chat Input -->
        <input type="text" id="messageInput" class="message-input" placeholder="Type a message..." autocomplete="off">

        <!-- Send Button (disabled when input is empty) -->
        <button class="send-btn disabled" id="sendBtn" type="button" aria-label="Send message" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </footer>

    <!-- Bottom Sheet (Neighbors List) -->
    <div class="bottom-sheet-backdrop" id="bottomSheetBackdrop">
      <div class="bottom-sheet" role="dialog" aria-modal="true" aria-label="Mesh Neighbors">
        <div class="bottom-sheet-handle"></div>
        <div class="bottom-sheet-header">
          <h2>Mesh Neighbors</h2>
          <button class="icon-btn" id="closeNeighborsBtn" aria-label="Close neighbors sheet">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div class="neighbors-list" id="neighborsList">
          <p style="color:var(--muted); text-align:center; padding:16px;">Scanning for mesh neighbors...</p>
        </div>
      </div>
    </div>

    <!-- Incoming Emergency Full-Screen Overlay -->
    <div class="emergency-overlay" id="emergencyOverlay" role="alert" aria-live="assertive">
      <svg class="emergency-overlay-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
        <line x1="12" y1="9" x2="12" y2="13"></line>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
      <div class="emergency-title">Emergency Alert</div>
      <div class="emergency-sender" id="emergencySender">From: Node X</div>
      <div class="emergency-payload" id="emergencyPayload">Emergency text</div>
      <div class="emergency-meta" id="emergencyMeta">Path: A > B > C &bull; 14:32:10</div>
      <button class="ack-btn" id="ackEmergencyBtn">Acknowledge Alert</button>
    </div>

    <!-- Toasts Container for Neighbor Events -->
    <div class="toast-container" id="toastContainer" aria-live="polite"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
